      <h1>WAM Calculator — Free WAM Calculator for the university</h1>
      <p>
        Free <strong>WAM calculator Uni</strong> students use to compute Weighted Average Mark (WAM) from unit marks
        and credit points. This WAM calculator applies official Year 1 half weighting (0.5), shows HD/D/C/P grade
        bands, and links to WAM to GPA conversion — no signup required.
      </p>
      <h2>How WAM Is Calculated</h2>
      <p>
        Official WAM = sum(mark × credit points × year weight) ÷ sum(credit points × year weight). Year 1
        undergraduate units use 0.5 weight; Year 2 and above use 1.0.
      </p>
